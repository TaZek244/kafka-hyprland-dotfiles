# Theme pixel "KAFKA.SYS" cho Dunst — ghi đè màu/viền/bo góc trên dunst/dunstrc: khung VUÔNG viền 3px
# (lưới pixel), thanh tiến độ vuông, đồng bộ Waybar/popup/màn hình đăng nhập.
# Được chép vào dunst/dunstrc.d/50-ui-theme.conf bởi hypr/scripts/ui-theme.sh khi bật chế độ pixel.

[global]
    frame_width = 3
    frame_color = "#140e1a"
    corner_radius = 0
    separator_color = frame
    progress_bar_corner_radius = 0
    highlight = "#c94785"

[urgency_low]
    background = "#261e30f2"
    foreground = "#fbf7fd"
    frame_color = "#140e1a"
    highlight = "#c94785"

[urgency_normal]
    background = "#221a2bf5"
    foreground = "#fbf7fd"
    frame_color = "#c94785"
    highlight = "#c94785"

[urgency_critical]
    background = "#3a1626f2"
    foreground = "#fbf7fd"
    frame_color = "#e0506e"
    highlight = "#e0506e"
