# ==============================================================================
# Theme pixel "KAFKA.SYS" cho Dunst — Hộp thoại RPG (RPG Dialogue Box)
#
# Thiết kế lại thông báo theo phong cách khung thoại game nhập vai (JRPG Dialogue HUD):
# - Đặt ở đáy màn hình chính giữa (origin = bottom-center), cách mép dưới 24px (offset = 0x24),
#   thông báo tự động xếp chồng hướng lên trên.
# - Chiều rộng mở rộng (~620px) tạo thành khung hội thoại ngang đặc trưng.
# - Thẻ người nói (speaker name tag) với mũi tên hồng neon: ▶ %a, tiêu đề và lời thoại bên dưới.
# - Khung sắc nét dạng lưới pixel: viền dày 3px (frame_width = 3), không bo góc (corner_radius = 0),
#   icon chân dung nhân vật 48px, thanh tiến độ vuông phẳng.
#
# File này được hypr/scripts/ui-theme.sh sao chép vào dunst/dunstrc.d/50-ui-theme.conf
# khi chuyển sang chế độ "pixel", ghi đè cấu hình cơ bản từ dunst/dunstrc.
# ==============================================================================

[global]
    origin = bottom-center
    offset = 0x24
    width = (380, 620)
    height = (0, 160)
    frame_width = 3
    frame_color = "#c94785"
    corner_radius = 0
    padding = 16
    horizontal_padding = 18
    icon_position = left
    min_icon_size = 48
    max_icon_size = 48
    separator_color = frame
    progress_bar = true
    progress_bar_corner_radius = 0
    highlight = "#c94785"
    markup = full
    format = "<b><span foreground='#f08cbb'>▶ %a</span></b>\n<b>%s</b>\n%b"

[urgency_low]
    background = "#221a2bf5"
    foreground = "#fbf7fd"
    frame_color = "#5a4a6b"
    highlight = "#c94785"

[urgency_normal]
    background = "#221a2bf5"
    foreground = "#fbf7fd"
    frame_color = "#c94785"
    highlight = "#c94785"

[urgency_critical]
    background = "#221a2bf5"
    foreground = "#fbf7fd"
    frame_color = "#e0506e"
    highlight = "#e0506e"
