# Theme "pixel mềm" cho Dunst — ghi đè màu/viền/bo góc trên dunst/dunstrc.
# Được chép vào dunst/dunstrc.d/50-ui-theme.conf bởi hypr/scripts/ui-theme.sh khi bật chế độ pixel.

[global]
    frame_width = 2
    frame_color = "#140e1a"
    corner_radius = 10
    separator_color = frame
    progress_bar_corner_radius = 4
    highlight = "#c94785"

[urgency_low]
    background = "#261e30f2"
    foreground = "#fbf7fd"
    frame_color = "#140e1a"
    highlight = "#c94785"

[urgency_normal]
    background = "#261e30f2"
    foreground = "#fbf7fd"
    frame_color = "#140e1a"
    highlight = "#c94785"

[urgency_critical]
    background = "#3a1626f2"
    foreground = "#fbf7fd"
    frame_color = "#e0506e"
    highlight = "#e0506e"
