# Kafka's Web idle and power policy
general {
    ignore_systemd_inhibit = false   # nút "Giữ màn hình sáng" của control-popup.py dùng systemd-inhibit (thay module idle_inhibitor của Waybar)
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = \"on\" })"
}

# Dim the display after a short idle period; restore on activity.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# Lock after five minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn displays off shortly after locking; wake them on activity.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch "hl.dsp.dpms({ action = \"off\" })"
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = \"on\" })"
}

# Suspend after fifteen minutes only while running on battery.
listener {
    timeout = 900
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -n1)" = "0" ] && systemctl suspend'
}
