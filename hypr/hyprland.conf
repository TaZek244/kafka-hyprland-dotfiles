# !!! KHÔNG CÒN DÙNG từ Hyprland 0.57 (2026-11-14). Cấu hình thật: hypr/hyprland.lua
# !!! Giữ lại chỉ để tham khảo / quay về 0.56 (xóa hyprland.lua + hạ cấp gói hyprland).
# ==============================================================================
#  HYPRLAND CONFIGURATION - KAFKA (HONKAI: STAR RAIL) EDITION
#  Theme Palette:
#    Obsidian Base   : #141118 | #1e1826
#    Kafka Burgundy  : #b8326a | #8f2456
#    Lightning Lilac : #c77dff | #9b4dca
#    Coat Brass Gold : #d4af6a
#    Ivory Text      : #f4eef8
# ==============================================================================

# ----------------
# 1. MONITORS
# ----------------
monitor = , preferred, auto, 1

# ----------------
# 2. PROGRAMS & PATHS
# ----------------
$terminal    = kitty
$fileManager = nautilus
$menu        = rofi -show drun -theme ~/.config/rofi/kafka.rasi
$wallScript  = ~/.config/hypr/scripts/wallpaper-cycle.sh
# Hình nền cố định duy nhất
$wallpaper   = ~/.config/hypr/wallpapers/kafka_landscape_3.jpg
$powerMenu   = ~/.config/hypr/scripts/powermenu.sh
$clipMenu    = cliphist list | rofi -dmenu -p "Clipboard" -theme ~/.config/rofi/kafka.rasi | cliphist decode | wl-copy

# ----------------
# 3. AUTOSTART (EXEC-ONCE)
# ----------------
exec-once = waybar
exec-once = dunst
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = nm-applet --indicator
exec-once = fcitx5 -d
# awww-daemon chạy mãi không thoát, nên không nối bằng && (vế sau sẽ không bao giờ chạy)
exec-once = awww-daemon
exec-once = sleep 1 && $wallScript set $wallpaper
# Muốn tự đổi hình nền theo vòng thì thay dòng trên bằng:
#   exec-once = sleep 1 && $wallScript init
#   exec-once = sleep 2 && $wallScript auto 600
# Phase 2: Idle daemon (giảm sáng -> khóa -> tắt màn hình -> ngủ khi dùng pin)
exec-once = hypridle
# exec-once = hyprshell run   # TẮT: hyprshell 4.10.9 cần Hyprland >= 0.57 (0.56 không mở được tổng quan)
# Phase 3: Lưu lịch sử clipboard (văn bản + hình ảnh)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ----------------
# 4. ENVIRONMENT VARIABLES
# ----------------
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
# Input Method (Fcitx5 Vietnamese Unikey support)
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

# ----------------
# 5. LOOK AND FEEL (KAFKA THEME)
# ----------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2

    # Kafka Burgundy -> Electric Spider Lilac -> Brass Gold gradient
    col.active_border = rgba(b8326aff) rgba(c77dffff) rgba(d4af6aff) 45deg
    col.inactive_border = rgba(382b47aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 14

    active_opacity = 0.96
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(140d1cee)
    }

    blur {
        enabled = true
        size = 7
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        vibrancy = 0.22
    }
}

animations {
    enabled = true

    # Custom smooth "Spider Thread" bezier curves
    bezier = kafkaSnap, 0.05, 0.9, 0.1, 1.05
    bezier = kafkaSmooth, 0.25, 1, 0.5, 1
    bezier = linear, 0.0, 0.0, 1.0, 1.0

    animation = windows, 1, 5, kafkaSnap, popin 80%
    animation = windowsOut, 1, 5, kafkaSmooth, popin 80%
    animation = border, 1, 10, kafkaSmooth
    animation = borderangle, 1, 60, linear, loop
    animation = fade, 1, 5, kafkaSmooth
    animation = workspaces, 1, 5, kafkaSnap, slidefade 20%
}

dwindle {
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ----------------
# 6. INPUT & TOUCHPAD
# ----------------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Vuốt 3 ngón ngang để chuyển workspace (cú pháp Hyprland 0.51+)
gesture = 3, horizontal, workspace

# ----------------
# 7. KEYBINDINGS
# ----------------
$mainMod = SUPER

# Core Applications
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, X, forcekillactive,                       # buộc đóng app treo (KHÔNG dùng Shift+C: dễ nhầm với copy Ctrl+Shift+C)
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/closemenu.sh   # menu chọn chương trình để đóng
bind = $mainMod, T, exec, ~/.config/hypr/scripts/pin-toggle.sh        # treo cửa sổ nổi ở góc, theo mọi workspace
bind = $mainMod SHIFT, T, exec, ~/.config/hypr/scripts/pin-toggle.sh all  # bỏ treo tất cả
bind = $mainMod, M, exec, $powerMenu
bind = $mainMod, Escape, exec, pidof hyprlock || hyprlock
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Space, exec, $menu
bindr = $mainMod, Super_L, exec, ~/.config/hypr/scripts/window-count.sh   # nhấn-thả riêng Super: đếm chương trình đang mở
bind = $mainMod, R, exec, $menu
# Super + W (đổi hình nền) đã tắt vì dùng một hình nền cố định
# bind = $mainMod, W, exec, $wallScript next
bind = $mainMod SHIFT, B, exec, killall -SIGUSR2 waybar || waybar &
bind = $mainMod, V, exec, $clipMenu
bind = $mainMod, A, exec, kitty --class kafka-cava -e cava

# Window States
bind = $mainMod SHIFT, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit

# Screenshot (Grim + Slurp -> Clipboard & ~/Pictures/Screenshots)
bind = $mainMod SHIFT, S, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/snap_$(date +%Y%m%d_%H%M%S).png | wl-copy && notify-send "Kafka Desktop" "Đã chụp màn hình và lưu vào Clipboard!"
bind = , Print, exec, mkdir -p ~/Pictures/Screenshots && grim - | tee ~/Pictures/Screenshots/full_$(date +%Y%m%d_%H%M%S).png | wl-copy && notify-send "Kafka Desktop" "Đã chụp toàn màn hình!"

# Focus Navigation (Arrow keys + Vim HJKL)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u

# Workspaces (1-10)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad (Special Workspace)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, Z, movetoworkspace, special:magic

# Mouse Bindings (Move/Resize/Scroll Workspaces)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop Function Keys (Audio & Brightness)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ----------------
# 8. WINDOW RULES
# ----------------
# Cú pháp rule mới (Hyprland 0.53+): windowrule = <hiệu ứng>, match:<thuộc tính> <regex>
windowrule = suppress_event maximize, match:class .*
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$
windowrule = size 760 520, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$
windowrule = center on, match:class ^(org\.pulseaudio\.pavucontrol|pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:title ^(Open File|Save File|Confirm)$
# Cửa sổ sóng nhạc cava (Super + A)
windowrule = float on, match:class ^(kafka-cava)$
windowrule = size 720 260, match:class ^(kafka-cava)$
windowrule = move (monitor_w-732) (monitor_h-272), match:class ^(kafka-cava)$
