# Màn hình khoá — bản pixel "KAFKA.SYS" (đồng bộ Waybar/popup/màn hình đăng nhập). Bản thường: hyprlock.conf.
# hypr/scripts/lock.sh chọn file theo ~/.local/state/kafka/ui-theme (thiếu file này thì dùng bản thường).
# Thẻ nền là ảnh vẽ sẵn bằng waybar/pixel/make-frames.py (FIXED: lock-card 460x420, lock-clock 420x148, lưới ô
# 4px: góc bậc thang, viền tối, mép sáng/bóng, bóng cứng). Đổi cỡ thẻ thì sửa FIXED + `size` (= cạnh NGẮN,
# phải đúng cỡ ảnh — lệch là ảnh bị co giãn, nhoè điểm).
# Bóng chữ pixel = nhân đôi nhãn, bản tối lệch (+3, -3). Chữ đậm bằng markup <b> (hyprlock không nhận tên font "… Bold").
general {
    hide_cursor = true
}

background {
    path = ~/.cache/kafka_current_wallpaper
    color = rgba(141118ff)
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.2
    brightness = 0.6
}

# ---------- đồng hồ (thẻ trên) ----------
image {
    path = ~/.config/waybar/pixel/lock-clock.png
    size = 148
    rounding = 0
    border_size = 0
    position = 0, -60
    halign = center
    valign = top
}
label {    # bóng cứng lệch 1 điểm pixel (8px)
    text = $TIME
    font_size = 42
    font_family = Kafka Pixel
    color = rgb(140e1a)
    position = 8, -92
    halign = center
    valign = top
}
label {    # giờ bằng font pixel 5×7 của trình đăng nhập (fonts/KafkaPixel.ttf). font_size tính theo pt:
    text = $TIME          # 42pt = 56px = 8px/điểm (px phải chia hết cho 7, không thì điểm to nhỏ không đều)
    font_size = 42
    font_family = Kafka Pixel
    color = rgb(fbf7fd)
    position = 0, -84
    halign = center
    valign = top
}
label {
    text = cmd[update:60000] echo "<b>$(date +"%A, %d/%m/%Y")</b>"
    font_size = 15
    font_family = FiraCode Nerd Font
    color = rgb(d4cade)
    position = 0, -176
    halign = center
    valign = top
}

# ---------- thẻ giữa: ảnh đại diện + lời chào + ô mật khẩu ----------
image {
    path = ~/.config/waybar/pixel/lock-card.png
    size = 420
    rounding = 0
    border_size = 0
    position = 0, -40
    halign = center
    valign = center
}
shape {    # viền ngoài tối của ảnh đại diện
    size = 152, 152
    color = rgb(140e1a)
    rounding = 0
    border_size = 0
    position = 0, 70
    halign = center
    valign = center
}
image {
    path = ~/.config/hypr/wallpapers/Kafka_thumbail.jpg
    size = 146
    rounding = 0
    border_size = 4
    border_color = rgb(c94785)
    position = 0, 70
    halign = center
    valign = center
}
label {    # bóng
    text = <b>Listen... Paterson's rain is falling.</b>
    font_size = 14
    font_family = FiraCode Nerd Font
    color = rgb(140e1a)
    position = 2, -42
    halign = center
    valign = center
}
label {
    text = <b>Listen... Paterson's rain is falling.</b>
    font_size = 14
    font_family = FiraCode Nerd Font
    color = rgb(f08cbb)
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    size = 360, 50
    outline_thickness = 4
    rounding = 0
    inner_color = rgba(30263cff)
    outer_color = rgb(140e1a)
    check_color = rgb(c94785)
    fail_color = rgb(e0506e)
    font_color = rgb(fbf7fd)
    font_family = FiraCode Nerd Font
    dots_size = 0.26
    dots_spacing = 0.45
    dots_rounding = 0       # chấm vuông = chất pixel
    placeholder_text = <span foreground="##9a8bab"><b>Mật khẩu...</b></span>
    fail_text = <span foreground="##ff9aae"><b>Sai rồi — thử lại</b></span>
    fade_on_empty = false
    shadow_passes = 0
    position = 0, -120
    halign = center
    valign = center
}
label {
    text = <b>Enter để mở khoá</b>
    font_size = 11
    font_family = FiraCode Nerd Font
    color = rgb(9a8bab)
    position = 0, -180
    halign = center
    valign = center
}
