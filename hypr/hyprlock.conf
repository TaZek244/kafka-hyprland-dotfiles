# Kafka's Web lock screen
general {
    hide_cursor = true
}

background {
    # Nền khóa = hình nền đang dùng (wallpaper-cycle.sh cập nhật symlink này)
    path = ~/.cache/kafka_current_wallpaper
    color = rgba(141118ff)
    blur_passes = 3
    blur_size = 7
    vibrancy = 0.2
    brightness = 0.7
}

# Kafka avatar, centered slightly above the middle
image {
    path = ~/.config/hypr/wallpapers/Kafka_thumbail.jpg
    size = 160
    rounding = -1
    border_size = 3
    border_color = rgb(d4af6a)
    position = 0, 80
    # Ảnh vuông chân dung, cắt tròn vừa khuôn mặt
    halign = center
    valign = center
}

label {
    # $TIME là biến có sẵn của hyprlock (định dạng HH:MM), không fork date mỗi giây
    text = $TIME
    font_size = 96
    color = rgb(f4eef8)
    font_family = FiraCode Nerd Font
    position = 0, -70
    halign = center
    valign = top
}

label {
    text = cmd[update:60000] date +"%A, %d/%m/%Y"
    font_size = 22
    color = rgb(a99bbd)
    font_family = FiraCode Nerd Font
    position = 0, -215
    halign = center
    valign = top
}

label {
    text = <i>Listen... Paterson's rain is falling.</i>
    font_size = 18
    color = rgb(c77dff)
    font_family = FiraCode Nerd Font
    position = 0, -70
    halign = center
    valign = center
}

input-field {
    size = 320, 52
    outline_thickness = 2
    rounding = -1
    inner_color = rgba(141118ee)
    outer_color = rgb(b8326a)
    check_color = rgb(c77dff)
    fail_color = rgb(ff4d6d)
    font_color = rgb(f4eef8)
    font_family = FiraCode Nerd Font
    placeholder_text = <i>Mật khẩu...</i>
    fail_text = <i>Sai rồi — thử lại</i>
    fade_on_empty = false
    position = 0, 150
    halign = center
    valign = bottom
}
