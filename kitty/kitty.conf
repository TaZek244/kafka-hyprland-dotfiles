# ==============================================================================
#  KITTY TERMINAL - KAFKA (HONKAI: STAR RAIL) PALETTE
# ==============================================================================

font_family                 FiraCode Nerd Font Mono
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
font_size                   11.5

window_padding_width        14
background_opacity          0.88

# Chế độ Desktop (cửa sổ tự do): mở với cỡ cố định vừa phải. Nếu để kitty nhớ cỡ lần trước (thường là cột
# cao gần hết màn hình) thì cửa sổ mở ra gần bằng màn hình và bị phóng to luôn. Chế độ cuộn không bị ảnh hưởng.
remember_window_size  no
initial_window_width  1000
initial_window_height 640
confirm_os_window_close     0
enable_audio_bell           no
cursor_shape                beam
cursor_trail                1

# Primary Colors
background                  #140e1c
foreground                  #f4eef8
selection_background        #b8326a
selection_foreground        #ffffff
url_color                   #c77dff
cursor                      #d4af6a
cursor_text_color           #140e1c

# Normal Colors
color0                      #1e1826
color1                      #d8316d
color2                      #a8e6cf
color3                      #d4af6a
color4                      #9b4dca
color5                      #b8326a
color6                      #c77dff
color7                      #e6dcef

# Bright Colors
color8                      #4a3b5c
color9                      #ff5c8a
color10                     #b9fbc0
color11                     #e2c07d
color12                     #b565f2
color13                     #e05297
color14                     #e0aaff
color15                     #ffffff

# Copy/paste giống mọi ứng dụng khác (Ctrl+C / Ctrl+V)
#   Ctrl+C: có vùng bôi đen -> copy; không bôi đen -> vẫn là ngắt chương trình (SIGINT)
#   Ctrl+V: dán clipboard. Ctrl+Shift+C/V mặc định của kitty vẫn dùng được.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
