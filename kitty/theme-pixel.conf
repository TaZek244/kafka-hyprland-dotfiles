# ==============================================================================
#  KITTY TERMINAL - THEME "PIXEL MỀM" (KAFKA SOFT PIXEL)
#  File này được include ở cuối kitty.conf khi chế độ giao diện là "pixel".
#  Chỉ ghi đè màu sắc, con trỏ, độ trong suốt, thanh tab và viền chia cửa sổ;
#  giữ nguyên font, cỡ chữ, phím tắt và kích thước cửa sổ từ cấu hình gốc.
# ==============================================================================

# --- Độ trong suốt (Opacity) ---
background_opacity          0.92

# --- Con trỏ khối kiểu game (Retro Block Cursor) ---
# Giữ nguyên cursor_trail từ kitty.conf, chuyển sang khối vuông nhấp nháy đều
cursor_shape                block
cursor_blink_interval       0.6
cursor_stop_blinking_after  0
cursor                      #f08cbb
cursor_text_color           #1e1725

# --- Màu nền, chữ & vùng chọn cơ bản (Base Colors) ---
background                  #1e1725
foreground                  #fbf7fd
selection_background        #c94785
selection_foreground        #ffffff
url_color                   #f08cbb

# --- Bảng 16 màu ANSI (Normal & Bright Colors) ---
# Màu thường (0-7): dịu mắt, độ tương phản tốt trên nền tím than #1e1725
color0                      #2a2134
color1                      #e0506e
color2                      #7fd6a8
color3                      #e8c27a
color4                      #a37de0
color5                      #c94785
color6                      #7cc4d6
color7                      #d4cade

# Màu sáng (8-15): sáng hơn rõ rệt; color8 đủ sáng để đọc comment trong shell/vim
color8                      #6f6283
color9                      #ff9aae
color10                     #a8f0c8
color11                     #f7dc9c
color12                     #c6a6f5
color13                     #f08cbb
color14                     #a6e3ef
color15                     #fbf7fd

# --- Đánh dấu văn bản (Marks - Hồng nhấn / Tím / Xanh lơ) ---
mark1_background            #c94785
mark1_foreground            #ffffff
mark2_background            #a37de0
mark2_foreground            #1e1725
mark3_background            #7cc4d6
mark3_foreground            #1e1725

# --- Thanh Tab kiểu Pixel (Pixel Tab Bar) ---
tab_bar_edge                top
tab_bar_style               separator
tab_separator               ""
tab_title_template          " {index}·{title} "
tab_bar_min_tabs            2
tab_bar_margin_height       4 4
tab_bar_background          #140e1a
active_tab_background       #c94785
active_tab_foreground       #ffffff
active_tab_font_style       bold
inactive_tab_background     #30263c
inactive_tab_foreground     #9a8bab
inactive_tab_font_style     normal

# --- Viền giữa các cửa sổ chia (Split Window Borders) ---
window_border_width         2pt
window_margin_width         0
draw_minimal_borders        yes
active_border_color         #c94785
inactive_border_color       #3a2f46
bell_border_color           #e0506e
