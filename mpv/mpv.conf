# mpv — trình xem video, màu Kafka. Liên kết vào ~/.config/mpv bởi install.sh.
# Phím: Space dừng/chạy · ←/→ tua 5s · ↑/↓ tua 1 phút · 9/0 âm lượng · f toàn màn hình · q thoát (nhớ vị trí)

# Giữ cửa sổ khi hết video (xem lại / tua được), nhớ vị trí khi thoát bằng q
keep-open = yes
save-position-on-quit = yes
# Giải mã bằng GPU khi được, an toàn
hwdec = auto-safe
vo = gpu-next
# Cửa sổ mở vừa phải (không quá 80% màn hình)
autofit-larger = 80%x80%

# Chữ OSD & phụ đề
osd-font = "FiraCode Nerd Font"
osd-font-size = 28
osd-color = "#f4eef8"
osd-border-color = "#140e1c"
osd-bar-align-y = 0.9
sub-font = "FiraCode Nerd Font"
sub-color = "#f4eef8"
sub-border-color = "#140e1c"
sub-auto = fuzzy
# Màn hình chờ khi mở mpv không có file
background-color = "#140e1c"
