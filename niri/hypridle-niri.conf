# Kafka's Web idle and power policy
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = niri msg action power-on-monitors
}

# Giảm sáng màn hình sau một khoảng nhàn rỗi ngắn; khôi phục khi có hoạt động.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# Khóa sau năm phút.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Tắt màn hình ngay sau khi khóa; bật lại khi có hoạt động.
listener {
    timeout = 330
    on-timeout = niri msg action power-off-monitors
    on-resume = niri msg action power-on-monitors
}

# Tạm ngưng sau mười lăm phút nhưng chỉ khi đang dùng pin.
listener {
    timeout = 900
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/AC*/online 2>/dev/null | head -n1)" = "0" ] && systemctl suspend'
}
